name: Daily filings

on:
  schedule:
    - cron: "17 14 * * 1-5"  # 23:17 Korea time, Mon–Fri (DART filings are complete by then)
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to collect"
        default: "4"
  push:
    branches: [main]          # code or guide changes: rebuild and redeploy only

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-filings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-5-5' }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      SITE_NAME: ${{ vars.SITE_NAME }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      ADSENSE_PUB_ID: ${{ vars.ADSENSE_PUB_ID }}
      ADSENSE_SLOT_INARTICLE: ${{ vars.ADSENSE_SLOT_INARTICLE }}
      ADSENSE_SLOT_LIST: ${{ vars.ADSENSE_SLOT_LIST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect filings from DART
        if: github.event_name != 'push' && env.DART_API_KEY != ''
        run: python collect.py --days ${{ github.event.inputs.days || '4' }}

      - name: Summarize and check numbers
        if: github.event_name != 'push' && env.ANTHROPIC_API_KEY != ''
        run: python summarize.py

      - name: Save data to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Filings $(date -u +%F)"
          git push

      - name: Build site
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
